<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061233"/>
      <stop offset="100%" stop-color="#020818"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffa500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ffa500"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4fd6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ambient sun glow -->
  <ellipse cx="256" cy="210" rx="200" ry="180" fill="url(#sunGlow)"/>

  <!-- Sun rays -->
  <g transform="translate(256,205)" filter="url(#glow)" opacity="0.9">
    <line x1="0" y1="-95" x2="0" y2="-70" stroke="#ffa500" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="70"  x2="0" y2="95"  stroke="#ffa500" stroke-width="8" stroke-linecap="round"/>
    <line x1="-95" y1="0" x2="-70" y2="0" stroke="#ffa500" stroke-width="8" stroke-linecap="round"/>
    <line x1="70"  y1="0" x2="95"  y2="0" stroke="#ffa500" stroke-width="8" stroke-linecap="round"/>
    <line x1="-67" y1="-67" x2="-50" y2="-50" stroke="#ffa500" stroke-width="6" stroke-linecap="round"/>
    <line x1="50"  y1="-50" x2="67"  y2="-67" stroke="#ffa500" stroke-width="6" stroke-linecap="round"/>
    <line x1="-67" y1="67"  x2="-50" y2="50"  stroke="#ffa500" stroke-width="6" stroke-linecap="round"/>
    <line x1="50"  y1="50"  x2="67"  y2="67"  stroke="#ffa500" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sun core circle -->
  <circle cx="256" cy="205" r="52" fill="url(#sunCore)" filter="url(#glow)"/>
  <circle cx="256" cy="205" r="40" fill="#ffdd44"/>
  <circle cx="244" cy="193" r="12" fill="rgba(255,255,255,0.25)"/>

  <!-- Solar panel below sun -->
  <rect x="128" y="310" width="256" height="80" rx="8" fill="url(#panel)"/>
  <!-- Panel grid lines -->
  <line x1="213" y1="310" x2="213" y2="390" stroke="rgba(191,219,254,0.4)" stroke-width="1.5"/>
  <line x1="299" y1="310" x2="299" y2="390" stroke="rgba(191,219,254,0.4)" stroke-width="1.5"/>
  <line x1="128" y1="350" x2="384" y2="350" stroke="rgba(191,219,254,0.4)" stroke-width="1.5"/>
  <!-- Panel shine -->
  <rect x="128" y="310" width="256" height="30" rx="8" fill="rgba(255,255,255,0.1)"/>
  <!-- Panel stand -->
  <rect x="238" y="390" width="36" height="22" rx="4" fill="#1e3a8a"/>

  <!-- Text: MS monogram -->
  <text x="256" y="478" font-family="Outfit, Arial, sans-serif" font-size="36" font-weight="900"
        fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">MAHENDRA</text>
</svg>
